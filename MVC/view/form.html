<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Form</title>
  <style>
   
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fcb08c, #5d4954);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    input[type="submit"] {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="file"] {
      padding: 5px;
    }

    input[type="submit"] {
      background: #fcb08c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background: #e2845a;
    }

    input::placeholder {
      color: #888;
    }

  </style>
</head>
<body>
    <form action="/product" method="post" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Product title" />
      <input type="number" name="price" placeholder="Product Price" />
      <input type="file" name="image" id="" />
      <input type="submit"  value="Add Product"/>
    </form>
</body>
</html>
